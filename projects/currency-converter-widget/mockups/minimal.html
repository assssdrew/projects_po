<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .widget {
    width: 364px;
    height: 170px;
    background: #121316;
    border-radius: 22px;
    box-sizing: border-box;
    padding: 10px 16px 8px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
  }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .cell { display: flex; flex-direction: column; }
  .line { display: flex; flex-direction: row; align-items: center; line-height: 1.05; }
  .from { width: 94px; font-weight: 700; font-size: 16px; color: #FFFFFF; white-space: nowrap; overflow: hidden; }
  .arrow { width: 24px; text-align: center; font-size: 13px; color: rgba(255,255,255,0.4); }
  .to { font-weight: 700; font-size: 16px; color: #FFFFFF; white-space: nowrap; }
  .sub { display: flex; flex-direction: row; align-items: center; line-height: 1; }
  .sub-text { font-size: 9px; }
  .up { color: #34C759; }
  .down { color: #FF453A; }
  .spark { width: 28px; height: 10px; margin-left: 6px; }
  .footer { display: flex; flex-direction: row; align-items: center; justify-content: flex-end; }
  .refresh { width: 11px; height: 11px; }
</style>
</head>
<body>
  <div class="widget">
    <div class="rows">
      <div class="cell">
        <div class="line">
          <div class="from">147 USD</div>
          <div class="arrow">&#8594;</div>
          <div class="to">12 240,69 RUB</div>
        </div>
        <div class="sub">
          <div class="sub-text up">&#9650;0.42%&nbsp;&nbsp;за 24ч</div>
          <svg class="spark" viewBox="0 0 28 10">
            <polyline points="0,8 6,6 12,7 18,3 24,4 28,1" fill="none" stroke="#34C759" stroke-width="1.4" />
          </svg>
        </div>
      </div>
      <div class="cell">
        <div class="line">
          <div class="from">147 EUR</div>
          <div class="arrow">&#8594;</div>
          <div class="to">14 233,36 RUB</div>
        </div>
        <div class="sub">
          <div class="sub-text down">&#9660;0.18%&nbsp;&nbsp;за 24ч</div>
          <svg class="spark" viewBox="0 0 28 10">
            <polyline points="0,2 6,4 12,3 18,7 24,6 28,9" fill="none" stroke="#FF453A" stroke-width="1.4" />
          </svg>
        </div>
      </div>
      <div class="cell">
        <div class="line">
          <div class="from">147 RUB</div>
          <div class="arrow">&#8594;</div>
          <div class="to">44 839,68 VND</div>
        </div>
        <div class="sub">
          <div class="sub-text up">&#9650;0.06%&nbsp;&nbsp;за 24ч</div>
          <svg class="spark" viewBox="0 0 28 10">
            <polyline points="0,7 6,6 12,5 18,5 24,3 28,2" fill="none" stroke="#34C759" stroke-width="1.4" />
          </svg>
        </div>
      </div>
      <div class="cell">
        <div class="line">
          <div class="from">147 USD</div>
          <div class="arrow">&#8594;</div>
          <div class="to">3,73 млн VND</div>
        </div>
        <div class="sub">
          <div class="sub-text up">&#9650;0.06%&nbsp;&nbsp;за 24ч</div>
          <svg class="spark" viewBox="0 0 28 10">
            <polyline points="0,7 6,6 12,5 18,5 24,3 28,2" fill="none" stroke="#34C759" stroke-width="1.4" />
          </svg>
        </div>
      </div>
    </div>
    <div class="footer">
      <svg class="refresh" viewBox="0 0 24 24" fill="none" stroke="#34C759" stroke-width="2.5">
        <path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3" />
        <path d="M18 3v5h-5M6 21v-5h5" />
      </svg>
    </div>
  </div>
</body>
</html>
