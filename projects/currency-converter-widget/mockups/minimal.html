<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0B0C0E; }
  .tile {
    width: 1080px;
    height: 560px;
    background: #0B0C0E;
    border-radius: 66px;
    padding: 40px 42px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: #F5F6F7;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
  }
  .row.active {
    background: rgba(52,120,246,0.18);
    border-radius: 24px;
    padding: 14px 18px;
    margin: 0 -18px;
  }
  .code { font-size: 42px; font-weight: 700; }
  .value { font-size: 58px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row.active .value { color: #5AA4FF; }
  .divider { height: 3px; background: rgba(255,255,255,0.22); margin: 10px 0; }
</style>
</head>
<body>
  <div class="tile">
    <div class="row active"><span class="code">🇺🇸 USD</span><span class="value">10 002</span></div>
    <div class="divider"></div>
    <div class="row"><span class="code">🇷🇺 RUB</span><span class="value">834 714,77</span></div>
    <div class="divider"></div>
    <div class="row"><span class="code">🇻🇳 VND</span><span class="value">261,03 млн</span></div>
    <div class="divider"></div>
    <div class="row"><span class="code">🇧🇷 BRL</span><span class="value">51 854,68</span></div>
  </div>
</body>
</html>
