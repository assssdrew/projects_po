<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0B0C0E; }
  .tile {
    width: 1080px;
    height: 560px;
    background: #0B0C0E;
    border-radius: 66px;
    padding: 24px 42px 18px 42px;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: #F5F6F7;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 0;
  }
  .row.active {
    background: rgba(52,120,246,0.18);
    border-radius: 24px;
    padding: 15px 18px;
    margin: 0 -18px;
  }
  .code { font-size: 42px; font-weight: 700; }
  .value { font-size: 45px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row.active .value { color: #5AA4FF; }
  .divider { height: 3px; background: rgba(255,255,255,0.08); margin: 6px 0; }
  .spacer { flex: 1; }
  .refresh {
    display: flex;
    justify-content: flex-end;
    padding-top: 6px;
  }
  .refresh svg { width: 34px; height: 34px; }
</style>
</head>
<body>
  <div class="tile">
    <div class="row active"><span class="code">🇺🇸 USD</span><span class="value">1 000</span></div>
    <div class="divider"></div>
    <div class="row"><span class="code">🇪🇺 EUR</span><span class="value">860</span></div>
    <div class="divider"></div>
    <div class="row"><span class="code">🇷🇺 RUB</span><span class="value">83 270</span></div>
    <div class="divider"></div>
    <div class="row"><span class="code">🇻🇳 VND</span><span class="value">25,4 млн</span></div>
    <div class="divider"></div>
    <div class="row"><span class="code">🇹🇭 THB</span><span class="value">32 100</span></div>
    <div class="spacer"></div>
    <div class="refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="#34C759" stroke-width="2.4">
        <path d="M4 4v5h5"/>
        <path d="M20 20v-5h-5"/>
        <path d="M5.5 15A8 8 0 0119 8.5M18.5 9A8 8 0 015 15.5"/>
      </svg>
    </div>
  </div>
</body>
</html>
